name: Verify rewrite
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test jar
      - uses: actions/upload-artifact@v4
        with:
          name: java-results
          path: |
            build/reports/tests/
            build/libs/
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testing
          POSTGRES_DB: fbclan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testing@localhost:5432/fbclan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]==3.2.9'
      - run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/baseline.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/legacy_data.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/001_v3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/migration_data.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/behavior.sql
          python supabase/tests/concurrency.py
